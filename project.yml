# XcodeGen spec — the .xcodeproj is generated, not committed.
# Locally: `brew install xcodegen && xcodegen generate`
# CI runs the same two steps, so no Mac is required to build or test.
name: DiceApp

options:
  bundleIdPrefix: com.herbenderbler
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift language mode (4.0/4.2/5.0/6.0), not a compiler release number.
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DiceApp:
    type: application
    platform: iOS
    sources:
      - DiceApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.herbenderbler.DiceApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: DiceApp/Info.plist
      properties:
        CFBundleDisplayName: Dice
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  DiceAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - DiceAppTests
    settings:
      base:
        # Test bundles need an Info.plist to code-sign in a local Xcode
        # build; CI masks this with CODE_SIGNING_ALLOWED=NO.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DiceApp

  DiceAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DiceAppUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DiceApp

schemes:
  DiceApp:
    build:
      targets:
        DiceApp: all
    test:
      gatherCoverageData: true
      targets:
        - DiceAppTests
        - DiceAppUITests
